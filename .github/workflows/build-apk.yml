name: Build Wise Poster Maker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: unzip -q WisePosterMaker_Android_Source.zip -d src
      - run: cd src/WisePosterMaker && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WisePosterMaker-APK
          path: src/WisePosterMaker/app/build/outputs/apk/debug/*.apk.
